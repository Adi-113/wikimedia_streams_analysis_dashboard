name: Ingest Wikimedia events

on:
  schedule:
    # Every 5 minutes, offset to :03, :08, :13, ... (UTC).
    # GitHub's minimum interval is 5 minutes. Avoiding :00/:05 matters because
    # those minutes are the busiest and scheduled jobs are often delayed there.
    - cron: "3-59/5 * * * *"
  workflow_dispatch:          # lets you also start it by hand from the Actions tab

# Never run two ingestions at once (they share the resume pointer in the DB).
concurrency:
  group: wikimedia-ingest
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      # Resumes from the last saved event id, replays what was missed since the
      # previous run, then exits once it reaches the live stream.
      - name: Ingest
        run: >
          python backend/ingestion.py
          --stop-when-live
          --run-seconds 240
          --batch-size 1000
          --max-per-minute 1000
          --retention-hours 0
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}