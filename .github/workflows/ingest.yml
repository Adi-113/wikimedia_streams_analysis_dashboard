name: Ingest Wikimedia events

on:
  schedule:
    # Every 10 min at off-peak minutes (:02, :12, ...). GitHub delays/drops jobs
    # at busy marks like :00 and :05, so these are less likely to be skipped.
    - cron: "2,12,22,32,42,52 * * * *"
  workflow_dispatch:          # allow manual runs from the Actions tab

# Never run two ingestions at once (they share the resume pointer in the DB).
concurrency:
  group: wikimedia-ingest
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      # Resumes from the last saved event id, replays the backlog since the
      # previous run, then exits once it reaches the live stream.
      - name: Ingest
        run: >
          python backend/ingestion.py
          --stop-when-live
          --run-seconds 240
          --batch-size 1000
          --max-per-minute 1000
          --retention-hours 0
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}